name: Build

on:
  pull_request:
    branches: ['main']

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24: Coolify/Nixpacks (pinned by .nvmrc) and Docker image runtime, 22: oldest supported
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  nixpacks-install:
    # Production (Coolify, Nixpacks 1.41.0) installs with corepack 0.24.1 on the
    # Node major from .nvmrc. Replay that path so a package manager it cannot
    # run (e.g. pnpm 11+) fails here instead of on the next deploy.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install like Nixpacks (corepack 0.24.1)
        run: |
          npm install -g corepack@0.24.1
          corepack enable
          pnpm --version
          pnpm i --frozen-lockfile

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ secrets.APP_IMAGE }}
